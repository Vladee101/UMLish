<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UMLish · Local UML Diagrams</title>
  </head>
  <body>
    <header id="bar">
      <strong>UMLish</strong>
      <span class="badge" title="The page's Content-Security-Policy blocks all network requests (connect-src 'none').">local only · nothing leaves your browser</span>
      <span class="grow"></span>
      <span id="status"></span>
      <select id="theme" aria-label="Diagram theme">
        <option value="classic">Classic</option>
        <option value="modern">Modern</option>
        <option value="handDrawn">Hand-drawn</option>
      </select>
      <select id="page" aria-label="Diagram page" hidden></select>
      <button id="open">Open</button>
      <button id="save">Save</button>
      <button id="fit">Fit</button>
      <button id="svg">SVG</button>
      <button id="png">PNG</button>
      <button id="print">Print / PDF</button>
      <button id="link">Copy link</button>
    </header>
    <main>
      <section id="source">
        <section id="editor" aria-label="PlantUML source"></section>
        <aside id="warnings" aria-label="Diagram warnings" hidden>
          <div id="warnings-title">Warnings</div>
          <ul id="warning-list"></ul>
        </aside>
      </section>
      <section id="view"><div id="stage"></div></section>
    </main>
    <input id="file-input" type="file" accept=".puml,.txt,text/plain" hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
