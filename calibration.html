<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Sequence diagram calibration</title>
  </head>
  <body>
    <header class="toolbar">
      <strong>Calibration</strong>
      <span class="badge">development only</span>
      <label for="fixture">Fixture</label>
      <select id="fixture"></select>
      <select id="page" aria-label="Diagram page" hidden></select>
      <button id="download-source">Download source</button>
      <label class="file-button" for="reference-file">Choose reference PNG</label>
      <input id="reference-file" type="file" accept="image/png" />
      <button id="flip">Flip</button>
      <label><input id="overlay" type="checkbox" /> Overlay</label>
      <label for="opacity">Reference opacity</label>
      <input id="opacity" type="range" min="0" max="100" value="50" />
    </header>
    <main>
      <p class="instructions">Render the downloaded source with PlantUML on your machine, then choose its PNG. Nothing is uploaded.</p>
      <div id="status" role="status" aria-live="polite"></div>
      <div id="comparison">
        <section class="pane ours">
          <h2>UMLish</h2>
          <div id="ours" class="diagram"></div>
        </section>
        <section class="pane reference">
          <h2>PlantUML reference</h2>
          <div class="diagram reference-diagram">
            <p id="reference-empty">Choose a locally rendered reference image to compare.</p>
            <img id="reference-image" alt="Locally rendered PlantUML reference" hidden />
          </div>
        </section>
      </div>
      <details>
        <summary>Fixture source</summary>
        <pre id="source"></pre>
      </details>
    </main>
    <script type="module" src="/src/calibration.ts"></script>
  </body>
</html>
